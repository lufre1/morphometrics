name: mito-morphometrics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-image
  - tifffile
  - zarr>=2.18,<3   # code uses the zarr v2 API (zarr.open(...)[key], create_dataset)
  - tqdm
  - matplotlib
  - statsmodels
  - pillow
  - openpyxl        # pd.read_excel in the RGC/LGN/N.opt. stats scripts
  # optional, only for inspect_overlap_napari.py: napari pyqt
